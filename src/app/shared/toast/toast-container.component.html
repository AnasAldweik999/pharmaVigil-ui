<div class="pv-toast-container" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pv-toast"
      [class.pv-toast--success]="toast.type === 'success'"
      [class.pv-toast--error]="toast.type === 'error'"
      role="alert"
      aria-atomic="true"
    >
      <span class="pv-toast-icon" aria-hidden="true">
        @if (toast.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8 4a.905.905 0 0 0-.9.995l.35 3.507a.552.552 0 0 0 1.1 0l.35-3.507A.905.905 0 0 0 8 4m.002 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2"/>
          </svg>
        }
      </span>
      <span class="pv-toast-body">{{ toast.message }}</span>
      <button type="button" class="pv-toast-close" (click)="toastService.dismiss(toast.id)" aria-label="Dismiss">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
        </svg>
      </button>
      <span class="pv-toast-progress" aria-hidden="true"></span>
    </div>
  }
</div>

<button
  type="button"
  class="pv-lang-toggle"
  (click)="toggle()"
  [attr.aria-label]="'Switch language to ' + otherLocaleName()"
  [title]="otherLocaleName()"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" class="pv-lang-toggle-icon">
    <circle cx="8" cy="8" r="6.5"/>
    <ellipse cx="8" cy="8" rx="2.7" ry="6.5"/>
    <line x1="1.6" y1="8" x2="14.4" y2="8"/>
  </svg>
  <span class="pv-lang-toggle-label">{{ otherLocaleName() }}</span>
</button>

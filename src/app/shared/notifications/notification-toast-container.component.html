<div class="pv-notif-toast-container" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <div class="pv-notif-toast" role="alert" aria-atomic="true" tabindex="0" (click)="onToastClick(toast)" (keydown.enter)="onToastClick(toast)">
      <span class="pv-notif-toast-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
        </svg>
      </span>
      <span class="pv-notif-toast-body">
        @if (toast.notification; as n) {
          <span class="pv-notif-toast-title">{{ n.title }}</span>
          <span class="pv-notif-toast-message">{{ n.message }}</span>
        } @else {
          <span class="pv-notif-toast-title">{{ 'notifications.newCountSummary' | translate:{ count: '' + toast.summaryCount } }}</span>
        }
      </span>
      <button type="button" class="pv-notif-toast-close" (click)="$event.stopPropagation(); dismiss(toast.id)" [attr.aria-label]="'grid.close' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
        </svg>
      </button>
      <span class="pv-notif-toast-progress" aria-hidden="true"></span>
    </div>
  }
</div>

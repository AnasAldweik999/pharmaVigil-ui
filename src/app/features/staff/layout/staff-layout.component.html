<!-- Mobile overlay — closes sidebar when tapped -->
@if (sidebarOpen()) {
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>
}

<!-- Sidebar -->
<div class="sidebar d-flex flex-column" [class.sidebar-open]="sidebarOpen()" [class.sidebar-collapsed]="sidebarService.collapsed()">

  <!-- Brand -->
  <div class="pv-sidebar-brand">
    <div class="pv-sidebar-brand-lockup">
      <div class="pv-sidebar-brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M5.338 1.59a61 61 0 0 0-2.837.856.48.48 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.7 10.7 0 0 0 2.287 2.233c.346.244.652.42.893.533q.18.085.293.118a1 1 0 0 0 .101.025 1 1 0 0 0 .1-.025q.114-.034.294-.118c.24-.113.547-.29.893-.533a10.7 10.7 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524z"/>
        </svg>
      </div>
      <div class="pv-sidebar-brand-text">
        <div class="pv-sidebar-brand-name">{{ 'nav.brandName' | translate }}</div>
        <div class="pv-sidebar-brand-sub">{{ 'nav.brandSubStaff' | translate }}</div>
      </div>
    </div>
    <!-- Collapse toggle: desktop only, mobile sidebar is off-canvas and always full-width when open -->
    <button
      type="button"
      class="pv-sidebar-collapse-btn d-none d-lg-flex"
      (click)="sidebarService.toggle()"
      [attr.aria-label]="(sidebarService.collapsed() ? 'nav.expandNavigation' : 'nav.collapseNavigation') | translate"
      [title]="(sidebarService.collapsed() ? 'nav.expandNavigation' : 'nav.collapseNavigation') | translate"
    >
      <svg
        class="pv-sidebar-collapse-icon"
        [class.pv-sidebar-collapse-icon-collapsed]="sidebarService.collapsed()"
        xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"
      >
        <path fill-rule="evenodd" d="M8.354 1.646a.5.5 0 0 1 0 .708L2.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
        <path fill-rule="evenodd" d="M12.354 1.646a.5.5 0 0 1 0 .708L6.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
      </svg>
    </button>
  </div>

  <!-- Nav -->
  <nav class="nav flex-column gap-1 flex-grow-1 px-2 pb-2">
    <a
      *appHasRole="'FIELD_REPORTER'"
      routerLink="/staff/reports"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="nav-link d-flex align-items-center gap-2"
      [title]="'nav.myReports' | translate"
      (click)="closeSidebar()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
        <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5H3.5A1.5 1.5 0 0 0 2 3h12a1.5 1.5 0 0 0-1.5-1.5H11A1.5 1.5 0 0 0 9.5 0z"/>
        <path d="M5 8h6v1H5zm0 3h6v1H5zm0-6h6v1H5z"/>
      </svg>
      <span class="pv-nav-label">{{ 'nav.myReports' | translate }}</span>
    </a>
    <a
      *appHasRole="'BATCH_LOG_REPORTER'"
      routerLink="/staff/batches"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="nav-link d-flex align-items-center gap-2"
      [title]="'nav.logSheet' | translate"
      (click)="closeSidebar()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M6 3.5A1.5 1.5 0 0 1 7.5 2h1A1.5 1.5 0 0 1 10 3.5v1A1.5 1.5 0 0 1 8.5 6v1H14a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0V8h-5v.5a.5.5 0 0 1-1 0V8h-5v.5a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 2 7h5.5V6A1.5 1.5 0 0 1 6 4.5zm-2 8A1.5 1.5 0 0 1 5.5 10h1A1.5 1.5 0 0 1 8 11.5v1A1.5 1.5 0 0 1 6.5 14h-1A1.5 1.5 0 0 1 4 12.5zm6 0a1.5 1.5 0 0 1 1.5-1.5h1a1.5 1.5 0 0 1 1.5 1.5v1a1.5 1.5 0 0 1-1.5 1.5h-1A1.5 1.5 0 0 1 10 12.5z"/>
      </svg>
      <span class="pv-nav-label">{{ 'nav.logSheet' | translate }}</span>
    </a>
  </nav>

</div>

<!-- Main content -->
<div class="main-content" [class.main-content-collapsed]="sidebarService.collapsed()">
  <div class="top-bar">

    <!-- Left -->
    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-sm btn-outline-secondary d-lg-none"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="'nav.toggleNavigation' | translate"
        style="width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
        </svg>
      </button>
      <span class="pv-topbar-title">{{ 'nav.brandSubStaff' | translate }}</span>
    </div>

    <!-- Right -->
    <div class="d-flex align-items-center gap-2">
      <!-- Language switcher: visible at every screen size -->
      <app-language-switcher />
      <app-notification-bell />
      <app-user-menu roleLabelKey="nav.staffRole" />
    </div>

  </div>

  <div class="page-content">
    <router-outlet />
  </div>
</div>

<app-toast-container />
<app-notification-toast-container />
